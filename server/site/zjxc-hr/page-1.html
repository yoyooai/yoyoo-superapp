<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>总览 · Agent看板 · 中际旭创 HR Agent</title>
  <style>
:root{
  color-scheme:light;
  --y-bg:#FFFFFF;
  --y-surface:#FDFDFE;
  --y-surface-2:#F1F1F4;
  --y-text:#17171C;
  --y-text-2:#55555C;
  --y-text-3:#86868B;
  --y-border:rgba(16,24,40,.08);
  --y-border-strong:rgba(16,24,40,.16);
  --y-accent:#0D74CE;
  --y-accent-weak:rgba(13,116,206,.08);
  --y-on-accent:#FFFFFF;
  /* 语义色：ok / warn / partial / bad 四个槽。partial 是独立的一个——
     跑了一半不是成功，也不是失败，把它画成任何一边都是在说谎。 */
  --y-ok:#218358;
  --y-warn:#AB6400;
  --y-partial:#BD4B00;
  --y-bad:#CE2C31;
  --y-ok-weak:#E9F6EE;
  --y-warn-weak:#FEF3DD;
  --y-partial-weak:#FFEEE0;
  --y-bad-weak:#FEEBEC;
  --y-info:#3A5BC7;
  --y-info-weak:#EDF0FE;
  /* 场景强调色槽（可选）：多板块应用用来做"每块换一个主题色"，
     不是给单页模块用的——单页模块该用 --y-accent。 */
  --y-scene-contacts:#0D74CE;
  --y-scene-contacts-weak:rgba(13,116,206,.08);
  --y-scene-contacts-on:#FFFFFF;
  --y-scene-archive:#3A5BC7;
  --y-scene-archive-weak:rgba(58,91,199,.08);
  --y-scene-archive-on:#FFFFFF;
  --y-scene-ticket:#BD4B00;
  --y-scene-ticket-weak:rgba(189,75,0,.08);
  --y-scene-ticket-on:#FFFFFF;
  --y-scene-cost:#00786B;
  --y-scene-cost-weak:rgba(0,120,107,.08);
  --y-scene-cost-on:#FFFFFF;
  --y-scene-principle:#6E56CF;
  --y-scene-principle-weak:rgba(110,86,207,.08);
  --y-scene-principle-on:#FFFFFF;
  /* Hero 高光：深浅两档不同值 —— 白斑不是"浅色的柔光在深色下的自然结果" */
  --y-glare:rgba(255,255,255,.55);
  /* 📊 图表色槽。分类色只准给"标记"（条/线/点）上色，**永远不给文字上色** ——
     检验单：文字一律用 --y-text/-2/-3，身份靠旁边那个色块传达。 */
  --y-cat-1:#2a78d6;--y-cat-2:#eb6834;--y-cat-3:#1baf7a;--y-cat-4:#eda100;
  --y-cat-5:#e87ba4;--y-cat-6:#008300;--y-cat-7:#4a3aa7;--y-cat-8:#e34948;
  --y-seq-1:#86b6ef;--y-seq-2:#5598e7;--y-seq-3:#2a78d6;--y-seq-4:#256abf;--y-seq-5:#104281;
  --y-div-pos:#2a78d6;--y-div-neg:#d03b3b;--y-div-mid:#E4E4E8;
  --y-dim:#D3D3D9;

  /* ── 📐 刻度层（09-08 第五刀）──────────────────────────────────────
     🔴 这一层**不是我定的**，数值整段搬自 Radix Themes 的 token 文件
        （radix-ui/themes → src/styles/tokens/{typography,space,radius,shadow}.css，MIT）。
        搬它的理由：09-08 之前这份正本只收了**颜色**，字号/间距/阴影仍散在组件层里
        手写（33px / 29px / 14.5px / 12.5px / 10.5px 这种"当天手感"值），
        于是"审美每次现场生产"这个病根只被治了一半。
     🔴 只搬**数值刻度**，不搬 Radix 的组件代码（我们沙盒里没有 React、没有构建步骤）。
     ⚠️ 刻意**不加** --y-font-display / --y-font-mono 之类字族槽：
        09-04 那次加过一层排版层，溪午比对后判定"旧的更好看"并整体撤回，
        design-lint 现在只认 --y-font。这里加的是**字号**刻度，不是字族。 */

  /* 字号 9 档 + 配套行高 + 配套字距（字号越大字距越紧 —— "精细排版"主要就是这一条） */
  --y-t1:12px; --y-t2:14px; --y-t3:16px; --y-t4:18px; --y-t5:20px;
  --y-t6:24px; --y-t7:28px; --y-t8:35px; --y-t9:60px;
  --y-lh1:16px; --y-lh2:20px; --y-lh3:24px; --y-lh4:26px; --y-lh5:28px;
  --y-lh6:30px; --y-lh7:36px; --y-lh8:40px; --y-lh9:60px;
  --y-ls1:.0025em; --y-ls2:0em; --y-ls3:0em; --y-ls4:-.0025em; --y-ls5:-.005em;
  --y-ls6:-.00625em; --y-ls7:-.0075em; --y-ls8:-.01em; --y-ls9:-.025em;

  /* 圆角 6 档（Radix）。卡片档从 22 收到 16 —— 22px 在密集工作台里读起来是"圆滚滚的
     气泡卡"，不是苹果那种利落；16 是正本允许区间（16–22）的下限，测试守着这条线。 */
  --y-r1:3px; --y-r2:4px; --y-r3:6px; --y-r4:8px; --y-r5:12px; --y-r6:16px;
  --y-radius:16px;
  --y-radius-sm:10px;
  --y-radius-pill:999px;

  /* 阴影：一律染色，且**每级都先叠一层 1px 描边环**再叠两层大扩散低透明投影。
     单层黑影＝卡片像贴纸；描边环+多层扩散＝"柔和层次"。--y-ring 单独导出，
     给需要只要环不要投影的地方（表格头、图表容器）用。 */
  --y-ring:rgba(16,24,40,.055);
  --y-shadow:0 0 0 1px rgba(16,24,40,.055),0 1px 2px -1px rgba(16,24,40,.10),0 2px 6px -2px rgba(16,24,40,.06);
  --y-shadow-lg:0 0 0 1px rgba(16,24,40,.055),0 8px 24px -6px rgba(16,24,40,.13),0 18px 44px -12px rgba(16,24,40,.10);

  /* 间距 9 档（Radix 的 4/8/12/16/24/32/40/48/64）。前六档与旧的 --y-s1..s6 完全一致，
     所以是**纯追加**，老模块不会因为这次改动位移。 */
  --y-s1:4px; --y-s2:8px; --y-s3:12px; --y-s4:16px; --y-s5:24px; --y-s6:32px;
  --y-s7:40px; --y-s8:48px; --y-s9:64px;
  --y-font:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--y-bg);color:var(--y-text)}
body{margin:0;padding:12px;font:14px/1.6 var(--y-font);-webkit-font-smoothing:antialiased}
/* 数字一律等宽：不加这条，表格里的数字会随内容左右跳，一眼就廉价。
   .y-num 给手写的地方用，td/th 直接兜住表格。
   （注意：本块在模板字符串里，注释中不能出现反引号——会提前闭合，已踩过。） */
.y-num,td,th{font-variant-numeric:tabular-nums}
a{color:var(--y-accent)}
:focus-visible{outline:2px solid var(--y-accent);outline-offset:2px}
::selection{background:var(--y-accent-weak)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--y-border-strong);border-radius:var(--y-radius-pill)}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important}
}
</style>
  <style>*{box-sizing:border-box;font-family:var(--y-font)}
body{margin:0;background:var(--y-bg);color:var(--y-text);-webkit-font-smoothing:antialiased}
.wrap{padding:2px 2px 34px;max-width:1120px}

/* ── Hero ─────────────────────────────────────────────────── */
.hd{position:relative;overflow:hidden;border-radius:var(--y-radius);padding:var(--y-s6) var(--y-s6);
    margin-bottom:var(--y-s5);background:var(--y-surface);box-shadow:var(--y-shadow)}
/* 🔴 09-08 看深色截图改：原来是 border-radius:50% 的**硬边圆**，
   浅色档看不出来，深色档就是一块边缘齐整的灰斑（像渲染坏了）。
   改成径向渐变淡出——这才是"高光"，不是"一个圆"。 */
.hd::after{content:"";position:absolute;right:-60px;top:-90px;width:300px;height:300px;pointer-events:none;
    background:radial-gradient(circle at center,var(--y-glare) 0%,transparent 70%)}
.hd .kicker{margin:0;font-weight:700;letter-spacing:2.4px;text-transform:uppercase;
    font-size:10px;color:var(--y-text-3)}
.hd h1{margin:10px 0 0;font-size:var(--y-t7);line-height:var(--y-lh7);font-weight:700;
    letter-spacing:var(--y-ls7);color:var(--y-text)}
.hd p.sub{margin:10px 0 0;font-size:var(--y-t2);color:var(--y-text-2);max-width:660px;line-height:1.75}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.chip{background:var(--y-surface);border:1px solid var(--y-border);color:var(--y-text-2);
    border-radius:var(--y-radius-pill);padding:6px 14px;font-size:12px;font-weight:600}
button.chip{cursor:pointer}
.chip.on{background:var(--y-accent);border-color:var(--y-accent);color:var(--y-on-accent)}

/* ── 分区标题 ─────────────────────────────────────────────── */
.sec{margin:var(--y-s6) 0 var(--y-s4);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec h2{margin:0;font-size:var(--y-t4);line-height:var(--y-lh4);font-weight:700;
    letter-spacing:var(--y-ls4);color:var(--y-text);display:flex;align-items:center;gap:8px}
.sec .sd{margin:4px 0 0;font-size:12px;color:var(--y-text-3)}
.sec .act{font-size:12px;color:var(--y-accent);font-weight:600;white-space:nowrap}

/* ── 卡片 ────────────────────────────────────────────────── */
.card{background:var(--y-surface);border:1px solid var(--y-border);border-radius:var(--y-radius);
    padding:var(--y-s4) var(--y-s5);margin-bottom:var(--y-s3);box-shadow:var(--y-shadow)}
.card.hl{border-color:var(--y-border-strong);box-shadow:var(--y-shadow-lg)}
.card.flat{box-shadow:none}
.card.pad0{padding:0;overflow:hidden}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:820px){.g2,.g3{grid-template-columns:minmax(0,1fr)}}

.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.muted{color:var(--y-text-3);font-size:12px}
.small{font-size:12px}
.title{font-weight:700;font-size:14px;color:var(--y-text);line-height:1.45}
.lead{font-size:13px;color:var(--y-text-2);line-height:1.7}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── 标签 ────────────────────────────────────────────────── */
.badge{display:inline-block;padding:4px 11px;border-radius:var(--y-radius-pill);font-size:11px;
    font-weight:600;letter-spacing:.2px;white-space:nowrap}
.b-pending{background:var(--y-warn-weak);color:var(--y-warn)}
.b-ai{background:var(--y-accent-weak);color:var(--y-accent)}
.b-approved{background:var(--y-ok-weak);color:var(--y-ok)}
.b-rejected{background:var(--y-bad-weak);color:var(--y-bad)}
.b-measured{background:var(--y-ok-weak);color:var(--y-ok)}
.b-decided{background:var(--y-accent-weak);color:var(--y-accent)}
.b-soft{background:var(--y-border);color:var(--y-text-2)}
.b-ok{background:var(--y-ok-weak);color:var(--y-ok)}
.b-warn{background:var(--y-warn-weak);color:var(--y-warn)}
/* 🔴 partial 有自己的槽：跑了一半、算不出、缺料 —— 画成绿或红都是在说谎 */
.b-partial{background:var(--y-partial-weak);color:var(--y-partial)}
.b-bad{background:var(--y-bad-weak);color:var(--y-bad)}
.b-info{background:var(--y-info-weak);color:var(--y-info)}

/* ── 按钮 ────────────────────────────────────────────────── */
.btn{border:none;border-radius:var(--y-radius-sm);padding:9px 17px;font-size:12px;font-weight:600;
    cursor:pointer;transition:opacity .15s;white-space:nowrap}
.btn:hover:not(:disabled){opacity:.85}
.btn-p{background:var(--y-accent);color:var(--y-on-accent)}
.btn-g{background:var(--y-ok);color:var(--y-on-accent)}
.btn-r{background:var(--y-surface);color:var(--y-bad);border:1px solid var(--y-bad-weak)}
.btn-o{background:var(--y-surface);color:var(--y-text-2);border:1px solid var(--y-border)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
input,textarea,select{border:1px solid var(--y-border);border-radius:var(--y-radius-sm);padding:7px 10px;
    font-size:12px;font-family:inherit;background:var(--y-surface);color:var(--y-text)}
input:focus,textarea:focus{outline:2px solid var(--y-border-strong);outline-offset:-1px}
label.fld{display:block;font-size:11px;color:var(--y-text-3);font-weight:600;margin-bottom:3px}

/* ── KPI：主次分明 ────────────────────────────────────────── */
/* 🔴 四个等重的 KPI 是"从来没决定过什么重要"的视觉形式。.kpi.lead 就是那个主 KPI。 */
.kpis{display:grid;grid-template-columns:minmax(0,1.35fr) repeat(3,minmax(0,1fr));gap:10px;margin-bottom:4px}
@media(max-width:820px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--y-surface);border:1px solid var(--y-border);border-radius:var(--y-radius);
    padding:var(--y-s5) var(--y-s5);box-shadow:var(--y-shadow);min-width:0}
.kpi .k{font-size:11px;color:var(--y-text-3);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
/* 🔴 09-08 改判：大数字**不用** tabular-nums。检验单原话——等宽数字把每位都撑成 0 的宽度，
   数字 121 在展示字号下看着松散。等宽只留给需要上下对齐的列（表格行、坐标轴刻度）。 */
.kpi .v{font-size:var(--y-t7);line-height:var(--y-lh7);font-weight:700;margin-top:4px;
    letter-spacing:var(--y-ls7);color:var(--y-text);font-variant-numeric:proportional-nums}
.kpi .d{font-size:11px;color:var(--y-text-3);margin-top:3px;line-height:1.5}
.kpi.lead{background:var(--y-accent-weak);border-color:var(--y-border-strong)}
.kpi.lead .k{color:var(--y-accent)}
.kpi.lead .v{font-size:var(--y-t8);line-height:var(--y-lh8);letter-spacing:var(--y-ls8);font-weight:700}
.kpi .v.bad{color:var(--y-bad)}
.kpi .v.partial{color:var(--y-partial)}

/* ── 密度件：决策行 ───────────────────────────────────────── */
/* 一单一张大卡 = 一屏看两单。改成"一张卡装多行"，一屏看六单，详情收进 <details>。 */
.dec{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--y-s5);align-items:center;
    padding:var(--y-s4) var(--y-s5);border-top:1px solid var(--y-border)}
.dec:first-child{border-top:none}
.dec:hover{background:var(--y-surface-2)}
@media(max-width:820px){.dec{grid-template-columns:minmax(0,1fr);gap:8px}}
.dec .who{min-width:0}
.dec .who .t{font-weight:700;font-size:var(--y-t2);color:var(--y-text)}
.dec .who .m{font-size:12px;color:var(--y-text-3);margin-top:2px}
.dec .acts{display:flex;gap:6px;align-items:center}
/* 数字块：右对齐 + 等宽，一列数字才能上下对齐着比 */
.figs{display:flex;gap:16px;text-align:right}
.fig{min-width:76px}
.fig .fk{font-size:11px;color:var(--y-text-3);font-weight:600}
.fig .fv{font-size:17px;font-weight:700;color:var(--y-text);font-variant-numeric:tabular-nums;
    letter-spacing:-.3px;margin-top:2px}
.fig .fv.ok{color:var(--y-ok)}.fig .fv.warn{color:var(--y-warn)}
.fig .fv.bad{color:var(--y-bad)}.fig .fv.partial{color:var(--y-partial)}
/* 毛利率相对底线的位置：一根细条比一个百分数更快。
   ⚠️ 刻意不叫 .bar —— 「总览」模块自带一个同名的 7px 三色堆叠条，
   同名不同义是以后必然踩的坑（谁先加载谁说话），所以这里叫 .mbar。 */
.mbar{height:4px;border-radius:var(--y-radius-pill);background:var(--y-border);overflow:hidden;margin-top:5px}
.mbar i{display:block;height:100%;border-radius:var(--y-radius-pill);background:var(--y-accent)}
.mbar i.ok{background:var(--y-ok)}.mbar i.warn{background:var(--y-warn)}
.mbar i.bad{background:var(--y-bad)}.mbar i.partial{background:var(--y-partial)}

details.more{margin-top:6px}
details.more>summary{cursor:pointer;font-size:12px;color:var(--y-accent);font-weight:600;
    list-style:none;display:inline-block}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:"▸ ";font-size:10px}
details.more[open]>summary::before{content:"▾ "}
details.more .body{margin-top:8px;padding:10px 12px;background:var(--y-surface-2);
    border-radius:var(--y-radius-sm);font-size:13px;line-height:1.7;color:var(--y-text-2)}

/* ── 密度件：表格（历史是用来翻的，表格的密度最高）───────────── */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
/* 🔴 表头**不铺底色**：Tabler/Radix 那类"国际化后台"的分层靠分隔线，不靠色块。
   铺底色的表头会把每张表切成两个色块，密集页面上一眼就是"土"。 */
.tbl th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--y-text-3);
    font-weight:600;padding:10px 14px;border-bottom:1px solid var(--y-border-strong);white-space:nowrap}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--y-border);color:var(--y-text);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--y-surface-2)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl .wrapcell{max-width:280px;color:var(--y-text-2);font-size:12px;line-height:1.6}
.tscroll{overflow-x:auto}

/* ── 状态件：五种态里的三种（骨架 / 主区大态）───────────────── */
/* 🔴 "加载中…"三个字不是加载态：它不占位，数据一到页面整个跳一下。 */
.skel .sk{background:var(--y-surface);border:1px solid var(--y-border);border-radius:var(--y-radius);
    margin-bottom:10px;padding:14px 16px;box-shadow:var(--y-shadow)}
.skel .ln{height:11px;border-radius:var(--y-radius-pill);background:var(--y-surface-2);
    animation:ypulse 1.4s ease-in-out infinite}
.skel .ln+.ln{margin-top:9px}
@keyframes ypulse{0%,100%{opacity:1}50%{opacity:.45}}
.skel .kpis .sk{height:78px}
/* 主区大态：空 / 错。**占据主区**，不是顶上一条细横幅——顶上那条会被人当装饰划过去。 */
.state{text-align:center;padding:44px 20px;border:1px dashed var(--y-border);
    border-radius:var(--y-radius);background:var(--y-surface)}
.state .ic{font-size:26px}
.state h3{margin:10px 0 0;font-size:14px;font-weight:800;color:var(--y-text)}
.state p{margin:6px auto 0;font-size:13px;color:var(--y-text-3);max-width:420px;line-height:1.7}
.state .btn{margin-top:14px}
.state.err{border-style:solid;border-color:var(--y-bad-weak);background:var(--y-bad-weak)}
.state.err h3{color:var(--y-bad)}
.state.err p{color:var(--y-text-2)}

/* ── 杂项 ────────────────────────────────────────────────── */
.hr{height:1px;background:var(--y-border);margin:12px 0}
.err{background:var(--y-bad-weak);color:var(--y-bad);border-radius:var(--y-radius-sm);padding:10px 12px;
    font-size:12px;margin-bottom:12px;border:1px solid var(--y-bad-weak)}
.load{color:var(--y-text-3);font-size:12px;padding:40px 0;text-align:center}
.foot{font-size:11px;color:var(--y-text-3);margin-top:8px;line-height:1.6}
.empty{text-align:center;padding:26px 16px;color:var(--y-text-3);font-size:12px;
    border:1px dashed var(--y-border);border-radius:var(--y-radius);background:var(--y-surface)}
.src{font-size:11px;color:var(--y-text-3);background:var(--y-bg);border-radius:6px;padding:3px 8px;
    display:inline-block}

/* 搜索条 */
.sbar{display:flex;gap:8px;align-items:center;background:var(--y-surface);border:1px solid var(--y-border);
    border-radius:var(--y-radius-sm);padding:8px 12px;margin-bottom:14px;box-shadow:var(--y-shadow)}
.sbar input{flex:1;border:none;padding:4px 2px;font-size:13px;background:transparent}
.sbar input:focus{outline:none}
.sbar .ico{color:var(--y-text-3);font-size:13px}
.sbar .cnt{font-size:11px;color:var(--y-text-3);white-space:nowrap}

/* 时间线行：一条事实 = 标签 + 正文 + 时间 */
.tl{padding:9px 0;border-top:1px solid var(--y-border);display:flex;gap:9px;align-items:flex-start}
.tl:first-child{border-top:none}
.tl .w{flex:1;min-width:0}
.tl .t{font-size:13px;color:var(--y-text);line-height:1.55}

/* 行内追问（替代 window.prompt —— 沙盒没给 allow-modals，弹层调了是静默无效） */
.ask{margin-top:8px;padding:10px 12px;background:var(--y-surface-2);border:1px solid var(--y-border);
    border-radius:var(--y-radius-sm)}
/* 追问框挂在决策行里时要横跨整行 —— 不写这条它只占第一列（.dec 是三列网格），
   输入框被挤成半宽，看着像没做完。截图时才看出来的，测试看不出这种事。 */
.dec>.ask{grid-column:1/-1}
.ask .fields{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.ask input{width:100%}
.ask .foot2{display:flex;gap:6px;margin-top:9px;align-items:center}
.ask .hint{font-size:11px;color:var(--y-text-3);margin-left:auto}
.ask .bad{color:var(--y-bad)}


/* ══════════════════════════════════════════════════════════════════════════
   📊 图表原语 + 模块组件（09-08 第四刀）

   🔴 这一段的规格**不是我定的**，逐条搬自 dataviz 检验单
      （choosing-a-form / marks-and-anatomy / anti-patterns），因为
      "我现场发挥审美"正是 09-08 那次"又短又少又丑"的病根本身。
      标记规格：
        · 条 <=24px 粗；**数据端 4px 圆角、基线端方角**；从单一基线长出
        · 线 2px，圆头圆角；端点 >=8px 直径且带 2px 底色描边（surface ring）
        · 面积填充＝该色 10% 透明的一层水washes，永远不是实心块
        · 网格/轴＝比底色深一档的 **1px 实线**（虚线被明确禁止：读起来像阈值）
        · 相邻标记之间靠 **2px 底色缝**分隔，不画描边
        · **绝不给每个点标数字**：只标端点、极值、或主角那一条
        · **文字永远不穿数据色**（浅色档四个分类色低于 3:1，救济条款＝
          必须有可见直标或表格视图，所以 .bars/.dev 的值是直标、且每图配
          details.more>.tbl 表格视图）
   🔴 三条"先别画图"的判据（最省事也最容易被我忽略的一层）：
        · 单个当前值 ⇒ 用 .kpi，**不要画一根条的条形图**
        · 一组很接近的值（128/136/124 这种）⇒ 用 .dev 偏差条以基准为中线，
          **不要零基线条形** —— 零基线下它们看着一样长，等于没画
        · 只有一项/一家 ⇒ 用 .kpi，不要画条
   ══════════════════════════════════════════════════════════════════════════ */

/* ── 图表外框：标题 + 结论 + 图 + 表格视图 ───────────────────────── */
.viz{margin:0}
.viz .vt{font-weight:700;font-size:14px;color:var(--y-text);margin:0 0 2px}
/* 一图一结论：图旁边那句话是图的一部分，不是可选装饰 */
.viz .vs{font-size:12px;color:var(--y-text-3);margin:0 0 12px;line-height:1.6}

/* 图例：>=2 条序列必须有；单条序列**不要**图例（标题已经说了画的是什么） */
.lg{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;padding:0;list-style:none}
.lg li,.lg span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--y-text-2)}
.lg i{width:10px;height:10px;border-radius:3px;flex-shrink:0;display:block}
.lg i.c1{background:var(--y-cat-1)}.lg i.c2{background:var(--y-cat-2)}
.lg i.c3{background:var(--y-cat-3)}.lg i.c4{background:var(--y-cat-4)}
.lg i.c5{background:var(--y-cat-5)}.lg i.c6{background:var(--y-cat-6)}
.lg i.c7{background:var(--y-cat-7)}.lg i.c8{background:var(--y-cat-8)}
.lg i.on{background:var(--y-seq-3)}.lg i.dim{background:var(--y-dim)}

/* ── 排序条形（比大小的默认形式：单 hue + emphasis）──────────────────
   用法：.bars > .brow[.on|.dim] > .bl 标签 + .bt>i 轨道 + .bv 值
   🔴 默认全部 .dim（灰），**只有主角那一条给 .on** —— 这就是 emphasis，
      检验单说它是最被低估的形式。给每条上不同颜色＝把长度重复编码成色相，
      是明确的反模式（"a value-ramp on nominal categories"）。 */
.bars{display:flex;flex-direction:column}
.brow{display:grid;grid-template-columns:minmax(88px,132px) minmax(0,1fr) minmax(56px,auto);
    gap:12px;align-items:center;padding:5px 0;position:relative}
.brow .bl{font-size:12px;color:var(--y-text-2);overflow-wrap:anywhere;min-width:0}
/* 轨道：条 <=24px 粗（这里 14px，条形图里给"空气"留够），基线端方角 */
.bt{height:14px;border-radius:0 var(--y-radius-pill) var(--y-radius-pill) 0;
    background:var(--y-surface-2);overflow:hidden;min-width:0}
.bt>i{display:block;height:100%;background:var(--y-dim);
    border-radius:0 4px 4px 0;   /* 数据端 4px 圆角、基线端方角 */
    transition:width .35s ease}
.brow.on .bt>i{background:var(--y-seq-3)}
.brow.warn .bt>i{background:var(--y-warn)}
.brow.bad .bt>i{background:var(--y-bad)}
.brow.ok .bt>i{background:var(--y-ok)}
/* 值：直标在条尾。列对齐 ⇒ 这里才该用 tabular-nums */
.brow .bv{font-size:12px;color:var(--y-text);text-align:right;
    font-variant-numeric:tabular-nums;white-space:nowrap}
.brow.dim .bl,.brow.dim .bv{color:var(--y-text-3)}
/* 参考线（标准/底线）：1px 实线，比底色深一档，绝不虚线 */
.bt.ref{position:relative}
/* 🔴 09-08 看图改：1px + --y-border-strong 在条形轨道上几乎看不见，
   参考线看不见等于没有参考线。加到 2px 并用文字三级色（仍属"recessive"档）。 */
.bt.ref::after{content:"";position:absolute;top:-4px;bottom:-4px;width:2px;
    background:var(--y-text-3);opacity:.55;left:var(--ref,75%);z-index:1}

/* ── 偏差条（值很接近时的正确形式：以基准为中线的 diverging）──────────
   用法：.dev > .brow > .bl + .dt>i[.pos|.neg] + .bv
   i 的 width 是"偏离基准多少"，从中线往两边长。 */
.dev .dt{position:relative;height:14px;background:var(--y-surface-2);border-radius:var(--y-radius-pill);
    overflow:hidden;min-width:0}
.dev .dt::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
    background:var(--y-border-strong)}
.dev .dt>i{position:absolute;top:0;bottom:0;display:block}
/* 偏差恰好为 0（它自己就是基准）：画一个骑在中线上的小方块。
   不画的话那一行是条空轨道，看着像"这行没数据"—— 09-08 看图时真的第一眼这么读了。 */
.dev .dt>i.zero{left:calc(50% - 3px);width:6px;background:var(--y-text-3);border-radius:3px}
.dev .dt>i.pos{left:50%;background:var(--y-div-pos);border-radius:0 4px 4px 0}
.dev .dt>i.neg{right:50%;background:var(--y-div-neg);border-radius:4px 0 0 4px}
.dev .bv.pos{color:var(--y-div-pos)}
.dev .bv.neg{color:var(--y-div-neg)}
/* 🔴 09-08 看图改：中性的 diverging 蓝/红**不带好坏含义**，可读者一定会把红读成"坏"。
   采购价那张图里 -5.2%（买便宜了，好事）画成了红、+8.6%（买贵了）画成了蓝 —— 读反了。
   所以当一侧确实代表"坏"时，改用 status 色（检验单：颜色真的代表好坏时才准用 status 色），
   由调用方显式声明极性，库不猜。 */
.dev.polar .dt>i.pos{background:var(--y-bad)}
.dev.polar .dt>i.neg{background:var(--y-ok)}
.dev.polar .bv.pos{color:var(--y-bad)}
.dev.polar .bv.neg{color:var(--y-ok)}
.dev.polar-rev .dt>i.pos{background:var(--y-ok)}
.dev.polar-rev .dt>i.neg{background:var(--y-bad)}
.dev.polar-rev .bv.pos{color:var(--y-ok)}
.dev.polar-rev .bv.neg{color:var(--y-bad)}
/* 中线是什么必须写出来，否则"偏离"没有意义 */
.dev .base{font-size:11px;color:var(--y-text-3);margin:2px 0 8px}

/* ── 哑铃（同一项的前后/两方对比）────────────────────────────────── */
.dumb .dt{position:relative;height:14px;min-width:0}
.dumb .dt::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;
    background:var(--y-border);transform:translateY(-.5px)}
.dumb .dt .seg{position:absolute;top:50%;height:2px;background:var(--y-seq-2);transform:translateY(-1px)}
.dumb .dt .pt{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
    transform:translate(-50%,-50%);border:2px solid var(--y-surface)}  /* 2px surface ring */
.dumb .dt .pt.a{background:var(--y-seq-4)}
.dumb .dt .pt.b{background:var(--y-seq-2)}

/* ── 比率对限值（meter）：轨道是同 ramp 的更浅一档，不是灰 ─────────── */
.meter{height:8px;border-radius:var(--y-radius-pill);background:var(--y-seq-5);overflow:hidden}
.meter>i{display:block;height:100%;border-radius:var(--y-radius-pill);background:var(--y-seq-3)}
.meter>i.warn{background:var(--y-warn)}
.meter>i.bad{background:var(--y-bad)}

/* ── 迷你折线 / 趋势（内联 SVG，模块只给 path 的 d）───────────────── */
.spark{display:block;width:100%;height:46px;overflow:visible}
.spark .ln{fill:none;stroke:var(--y-seq-3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark .ar{fill:var(--y-seq-3);fill-opacity:.10;stroke:none}   /* 面积＝10% 水洗 */
.spark .gd{stroke:var(--y-border);stroke-width:1}              /* 网格：1px 实线 */
.spark .ax{stroke:var(--y-border-strong);stroke-width:1}
.spark .end{fill:var(--y-seq-3);stroke:var(--y-surface);stroke-width:2}  /* 端点 + surface ring */
.spark .lb{fill:var(--y-text-3);font-size:10px}                /* 轴文字用文字色，不穿数据色 */
.spark .dim{stroke:var(--y-dim)}

/* ── 热力格（连续量级：单 hue，2px 底色缝分隔）────────────────────── */
.heat{display:grid;gap:2px}
/* 🔴 09-08 看图改：原来是 aspect-ratio:1，7 列摊开后每格变成 130px 的大方块，
   42 格占掉整页一半高度 —— 热力格的用处是"一眼扫过一片"，格子一大就没那个作用了，
   而且极浪费纵向空间（那正是"页面很长但信息很少"的另一种形态）。固定成一行 30px。 */
.heat .c{height:30px;border-radius:3px;background:var(--y-surface-2);position:relative}
/* 🔴 09-08 看图改：这里原来是 s1→seq-5 反着接的，于是**最小值拿到了最深的颜色**，
   "颜色越深＝值越高"那句副标题就是在说谎。token 已按"1＝低值端、5＝高值端"排好
   （浅色档 1 最浅 5 最深；深色档 1 最暗 5 最亮 —— 暗底上"更大＝更亮"），直接对位即可。 */
.heat .c.s1{background:var(--y-seq-1)}.heat .c.s2{background:var(--y-seq-2)}
.heat .c.s3{background:var(--y-seq-3)}.heat .c.s4{background:var(--y-seq-4)}
.heat .c.s5{background:var(--y-seq-5)}
.heat .hl{font-size:10px;color:var(--y-text-3);text-align:center;
    display:flex;align-items:center;justify-content:center}
/* 行标签：换行会把那一行的格子挤歪（真踩到："05 光学性能测试台-05"折成两行）。
   一行装不下就截断，全名在悬浮和表格视图里都有。 */
.heat .bl{display:flex;align-items:center;font-size:12px;color:var(--y-text-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px}
/* 色阶图例。检验单：连续量级的编码**必须**带 scale legend，否则深浅对应什么值只能猜 */
.scale{display:flex;gap:3px;align-items:center;margin:0 0 10px}
.scale i{width:24px;height:9px;border-radius:2px;display:block}
.scale i.s1{background:var(--y-seq-1)}.scale i.s2{background:var(--y-seq-2)}
.scale i.s3{background:var(--y-seq-3)}.scale i.s4{background:var(--y-seq-4)}
.scale i.s5{background:var(--y-seq-5)}
.scale span{font-size:11px;color:var(--y-text-3)}

/* ── hover 提示（图是交互的；但值永远也能从直标/表格视图读到）──────── */
.tip{position:absolute;z-index:5;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);
    background:var(--y-text);color:var(--y-bg);font-size:11px;line-height:1.5;
    padding:6px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;
    opacity:0;transition:opacity .12s;box-shadow:var(--y-shadow-lg)}
.brow:hover>.tip,.brow:focus-within>.tip,.tk:hover>.tip{opacity:1}

/* ══ 模块组件：把 09-08 那六份重复的自造样式收敛成一份正本 ══════════
   🔴 病历：v5 六个模块里各带一份 ~2000 字**一模一样**的 CSS
      （.contact/.avatar/.kanban/.klane/.tcard/.prio/.barrow/.qa/.principle/.pcard…）。
      componentCss.ts 开头警告过的那个病，我在 09-08 又原样犯了一遍 ——
      因为 design-lint 只禁"重定义已有组件"，没禁"自造新组件"，我从那个后门走了出去。
      所以这批组件必须在正本里，且 lint 已把那个后门关掉（见 server/design-lint.mjs）。 */

/* 垂直堆叠：卡片内部若干区块之间的间距。
   🔴 为什么要有它：没有它的时候我就去内联 style="margin-top:10px" ——
   那正是"把自己写样式换个地方继续"，lint 09-08 当场抓到过一次。
   间距值只在这里定义一次，全站一起改。 */
.vstack>*+*{margin-top:10px}
.vstack.tight>*+*{margin-top:6px}
.vstack.loose>*+*{margin-top:16px}

/* 人/设备条目：头像 + 名字 + 角色 */
.person{display:flex;gap:12px;align-items:center;min-width:0}
.person .av{width:42px;height:42px;border-radius:12px;background:var(--y-accent-weak);color:var(--y-accent);
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.person .pi{min-width:0}
.person .pn{font-weight:700;font-size:14px;color:var(--y-text);overflow-wrap:anywhere}
.person .pr{font-size:12px;color:var(--y-text-3);margin-top:2px}

/* 看板：泳道 + 卡片。列数由模块用 .k3/.k4/.k5 选，不自己写 grid */
.kanban{display:grid;gap:12px}
.kanban.k3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kanban.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kanban.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1180px){.kanban.k4,.kanban.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.kanban,.kanban.k3,.kanban.k4,.kanban.k5{grid-template-columns:minmax(0,1fr)}}
.lane>h3{font-size:11px;font-weight:700;color:var(--y-text-3);letter-spacing:.6px;text-transform:uppercase;
    margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lane>h3 .cnt{background:var(--y-surface-2);border-radius:var(--y-radius-pill);padding:1px 8px;
    font-size:11px;color:var(--y-text-2);font-weight:600}
.tk{background:var(--y-surface);border:1px solid var(--y-border);border-radius:var(--y-radius-sm);
    padding:11px 13px;margin-bottom:8px;box-shadow:var(--y-shadow);position:relative}
.tk .tkid{font-size:11px;color:var(--y-text-3);font-variant-numeric:tabular-nums}
.tk .tkt{font-weight:700;font-size:13px;color:var(--y-text);margin-top:2px;line-height:1.45}
.tk .tkm{font-size:11px;color:var(--y-text-3);margin-top:3px}
.tk .tka{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}

/* 问答块：一问一答，问题是标题不是正文 */
.qa{border-top:1px solid var(--y-border);padding:12px 0}
.qa:first-child{border-top:none;padding-top:0}
.qa .q{font-weight:700;font-size:13px;color:var(--y-text);line-height:1.5}
.qa .a{font-size:13px;color:var(--y-text-2);margin-top:5px;line-height:1.75}

/* 编号条目（原则/步骤）*/
.steps{counter-reset:st;margin:0;padding:0;list-style:none}
.steps>li{counter-increment:st;position:relative;padding-left:32px;margin-bottom:16px}
.steps>li::before{content:counter(st);position:absolute;left:0;top:0;width:22px;height:22px;
    border-radius:7px;background:var(--y-accent);color:var(--y-on-accent);font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center}
.steps>li>b{display:block;font-size:14px;color:var(--y-text);line-height:1.45}
.steps>li>p{margin:6px 0 0;font-size:13px;color:var(--y-text-2);line-height:1.8}

/* 对比卡：一个对象 + 若干"本次 vs 基准"的行 */
.cmp{margin-bottom:12px}
.cmp .ch{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:9px}
.cmp .ch b{font-size:14px;color:var(--y-text);display:block}
.cmp .ch .cs{font-size:11px;color:var(--y-text-3);margin-top:2px;display:block}
.cmp .cr{display:flex;align-items:center;justify-content:space-between;gap:10px;
    font-size:12px;color:var(--y-text-2);padding:4px 0}
.cmp .cr b{color:var(--y-text);font-variant-numeric:tabular-nums}
.cmp .cr b.pos{color:var(--y-div-pos)}
.cmp .cr b.neg{color:var(--y-div-neg)}
.cmp .cn{font-size:12px;color:var(--y-text-2);line-height:1.7;margin-top:9px;
    padding-top:9px;border-top:1px solid var(--y-border)}

/* ── 📱 手机硬底线（mobile floor）────────────────────────────
   来源：finesse-skill 的 mobile-floor.md「桌面页在手机上坏掉的六条」，
   溪午/衔青 2026-09-04 要求"按 skill 优化手机端适配"。
   只收"会坏掉"的那几条 —— 配色/字体/密度那一层溪午已否决，这里一律不动。
   测试宽度是钉死的四个：320 · 375 · 414 · 768（不是"把窗口拖窄看着差不多"）。 */

/* M4 · 长词在窄屏必然溢出：连字符复合词（"AI-generated"）和全大写品牌名
   只有一个断点，display 字号下一个词就比 320px 屏还宽，容器多宽都挡不住。
   用 anywhere 而不是 break-word —— break-word 不改变内在尺寸贡献，
   看着不溢出了，轨道还是被那个长词撑着。 */
h1,h2,h3,h4,.hd h1,.sec h2{overflow-wrap:anywhere;min-width:0}

/* 触摸目标 >=44px。判据用 pointer:coarse 而不只看宽度 —— 平板/触屏笔记本
   宽度不小但一样是手指点。桌面鼠标那支不动（32px 在鼠标下没问题，
   而且改桌面观感属于设计层，溪午已否决那一层）。 */
@media (max-width:820px),(pointer:coarse){
  .btn,.btn-sm,button.chip{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
  input,textarea,select{min-height:44px}
  .btn{padding:0 18px}
  .btn-sm{padding:0 12px}
}

/* 窄屏留白：34px/36px 的 hero 内边距在 320 屏上只剩 248px 能放内容。 */
@media (max-width:520px){
  .hd{padding:22px 18px;margin-bottom:18px}
  .hd h1{font-size:26px}
  .kpi{padding:16px 16px}
  .dec{padding:14px 16px}
  /* 条形行在窄屏改成两行：标签占满，轨道+值一行 —— 132px 的标签列在 320 屏上
     只剩 150px 给轨道，条形短到读不出长度差 */
  .brow{grid-template-columns:minmax(0,1fr) minmax(56px,auto);row-gap:4px}
  .brow .bl{grid-column:1/-1}
}</style>
  <style>
    html,body{margin:0;min-height:100%;background:var(--y-bg);color:var(--y-text)}
    body{padding:16px}
    #app{min-height:100vh}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
(function(){
  var Y = {};

  // ── 基础 ──────────────────────────────────────────────────────
  Y.esc = function(s){ var d=document.createElement("div"); d.textContent = String(s==null?"":s); return d.innerHTML; };
  Y.num = function(n){ return (typeof n==="number" && isFinite(n)) ? n : 0; };
  /** 千分位。大数字用比例数字（不等宽）——检验单：等宽让 121 在大字号下显松 */
  Y.fmt = function(n,digits){
    var v = Y.num(n), d = digits==null?0:digits;
    return v.toLocaleString("zh-CN",{minimumFractionDigits:d,maximumFractionDigits:d});
  };
  Y.wan = function(n,d){ return "¥"+Y.fmt(Y.num(n)/10000, d==null?1:d)+"万"; };
  Y.sign = function(n,d){ var v=Y.num(n); return (v>0?"+":"")+Y.fmt(v,d==null?1:d); };

  Y.hero = function(o){
    o = o||{};
    var chips = (o.chips||[]).map(function(c){ return '<span class="chip">'+Y.esc(c)+'</span>'; }).join("");
    return '<div class="hd">'+
      (o.kicker?'<p class="kicker">'+Y.esc(o.kicker)+'</p>':'')+
      '<h1>'+Y.esc(o.title||"")+'</h1>'+
      (o.sub?'<p class="sub">'+Y.esc(o.sub)+'</p>':'')+
      (chips?'<div class="chips">'+chips+'</div>':'')+
    '</div>';
  };
  Y.sec = function(icon,title,desc,act){
    return '<div class="sec"><div><h2>'+(icon?Y.esc(icon)+' ':'')+Y.esc(title)+'</h2>'+
      (desc?'<p class="sd">'+Y.esc(desc)+'</p>':'')+'</div>'+
      (act?'<span class="act">'+Y.esc(act)+'</span>':'')+'</div>';
  };
  Y.card = function(inner,cls){ return '<div class="card'+(cls?' '+cls:'')+'">'+inner+'</div>'; };
  Y.foot = function(t){ return '<p class="foot">'+Y.esc(t)+'</p>'; };
  Y.badge = function(text,tone){ return '<span class="badge b-'+(tone||"soft")+'">'+Y.esc(text)+'</span>'; };

  /**
   * KPI 行。检验单 choosing-a-form：**单个当前值就该是统计块，不是一根条的条形图**。
   * 第一个自动是主 KPI（.kpi.lead）—— 四个等重的 KPI 等于"从来没决定过什么重要"。
   */
  Y.kpis = function(items){
    var h = (items||[]).map(function(it,i){
      var tone = it.tone ? ' '+it.tone : '';
      return '<div class="kpi'+(i===0?' lead':'')+'">'+
        '<div class="k">'+Y.esc(it.k)+'</div>'+
        '<div class="v'+tone+'">'+Y.esc(it.v)+'</div>'+
        (it.d?'<div class="d">'+Y.esc(it.d)+'</div>':'')+
      '</div>';
    }).join("");
    return '<div class="kpis">'+h+'</div>';
  };

  /** 表格视图。检验单：每张图都要有一个"WCAG 干净"的等价物，值永远不被悬浮层独占。 */
  Y.tableView = function(columns,rows,summary){
    return '<details class="more"><summary>'+Y.esc(summary||"看数据表")+'</summary>'+
      '<div class="body tscroll">'+Y.table(columns,rows)+'</div></details>';
  };
  Y.table = function(columns,rows){
    var th = (columns||[]).map(function(c){
      var right = c && c.n;
      return '<th'+(right?' class="n"':'')+'>'+Y.esc(c&&c.t!=null?c.t:c)+'</th>';
    }).join("");
    var tb = (rows||[]).map(function(r){
      return '<tr>'+(r||[]).map(function(cell,i){
        var right = columns && columns[i] && columns[i].n;
        return '<td'+(right?' class="n"':'')+'>'+Y.esc(cell)+'</td>';
      }).join("")+'</tr>';
    }).join("");
    return '<table class="tbl"><thead><tr>'+th+'</tr></thead><tbody>'+tb+'</tbody></table>';
  };

  /**
   * 排序条形 —— 比大小的默认形式。
   * 检验单落在这里的四条，模块想违反也违反不了：
   *   ①默认按值降序（比大小就该排好序）
   *   ②**单 hue + emphasis**：只有 tone 明确给了的那几行上色，其余一律 --y-dim。
   *     给每行不同颜色＝把长度重复编码成色相，是明确的反模式。
   *   ③**只有一行数据时不画条**，自动降级成统计块（"the number is the chart"）
   *   ④超过 6 行时只直标极值和被强调的行，其余交给表格视图（不给每点都标数字）
   */
  Y.bars = function(o){
    o = o||{};
    var rows = (o.rows||[]).slice();
    if (!rows.length) return Y.emptyState(o.title, "没有数据");
    if (rows.length === 1) {
      // ③ 一根条的条形图 ⇒ 统计块
      return Y.viz(o.title, o.sub, Y.kpis([{ k: rows[0].label, v: rows[0].text!=null?rows[0].text:Y.fmt(rows[0].value,1), d: o.oneNote }]));
    }
    if (o.sort !== false) rows.sort(function(a,b){ return Y.num(b.value)-Y.num(a.value); });
    var max = Math.max.apply(null, rows.map(function(r){ return Y.num(r.value); }).concat([0])) || 1;
    var vals = rows.map(function(r){ return Y.num(r.value); });
    var hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals);
    var dense = rows.length > 6;
    var body = rows.map(function(r){
      var v = Y.num(r.value);
      var tone = r.tone || "dim";
      // ④ 密集时只标极值/被强调的
      var show = !dense || r.tone || v===hi || v===lo;
      var txt = r.text!=null ? r.text : Y.fmt(v,1);
      return '<div class="brow '+tone+'">'+
        '<span class="bl">'+Y.esc(r.label)+'</span>'+
        '<span class="bt'+(o.ref!=null?' ref':'')+'"'+(o.ref!=null?' style="--ref:'+(Y.num(o.ref)/max*100)+'%"':'')+'>'+
          '<i style="width:'+Math.max(0,Math.min(100, v/max*100))+'%"></i></span>'+
        '<b class="bv">'+(show?Y.esc(txt):'')+'</b>'+
        (r.tip?'<span class="tip">'+Y.esc(r.tip)+'</span>':'')+
      '</div>';
    }).join("");
    var tv = Y.tableView([o.labelHead||"项目",{t:o.valueHead||"数值",n:1}],
      rows.map(function(r){ return [r.label, r.text!=null?r.text:Y.fmt(Y.num(r.value),1)]; }));
    return Y.viz(o.title, o.sub, '<div class="bars">'+body+'</div>'+tv);
  };

  /**
   * 偏差条 —— **值很接近时唯一诚实的形式**。
   * 09-08 那次的具体病症：三家供应商报价 128/136/124 万用零基线条形画，
   * 三条几乎一样长，等于没画。这里以基准为中线，画的是"偏离基准多少"。
   * 检构单 choosing-a-form：Above/below a baseline; delta to target ⇒ diverging。
   */
  Y.dev = function(o){
    o = o||{};
    var rows = (o.rows||[]);
    if (!rows.length) return Y.emptyState(o.title,"没有数据");
    // 一行没有"分布"可言 ⇒ 统计块（和 Y.bars 同一条规矩：the number is the chart）
    if (rows.length === 1) {
      return Y.viz(o.title, o.sub, Y.kpis([{
        k: rows[0].label,
        v: rows[0].text!=null ? rows[0].text : (Y.sign(Y.num(rows[0].delta))+"%"),
        d: o.oneNote || ("基准：" + (o.base||""))
      }]));
    }
    // 极性：badWhen "pos"＝正偏差是坏事（如采购价高于历史均价）；"neg"＝反之；不给＝中性
    var polar = o.badWhen === "pos" ? " polar" : (o.badWhen === "neg" ? " polar-rev" : "");
    var span = Math.max.apply(null, rows.map(function(r){ return Math.abs(Y.num(r.delta)); }).concat([0])) || 1;
    var body = rows.map(function(r){
      var d = Y.num(r.delta), w = Math.abs(d)/span*50;   // 一半轨道 = 最大偏差
      var cls = d === 0 ? "zero" : (d > 0 ? "pos" : "neg");
      return '<div class="brow">'+
        '<span class="bl">'+Y.esc(r.label)+'</span>'+
        '<span class="dt"><i class="'+cls+'" style="width:'+w+'%"></i></span>'+
        '<b class="bv '+cls+'">'+Y.esc(r.text!=null?r.text:(Y.sign(d)+"%"))+'</b>'+
        (r.tip?'<span class="tip">'+Y.esc(r.tip)+'</span>':'')+
      '</div>';
    }).join("");
    var tv = Y.tableView([o.labelHead||"项目",{t:o.valueHead||"偏离基准",n:1}],
      rows.map(function(r){ return [r.label, r.text!=null?r.text:(Y.sign(Y.num(r.delta))+"%")]; }));
    return Y.viz(o.title, o.sub,
      '<p class="base">基准：'+Y.esc(o.base||"")+'（中线）</p>'+
      '<div class="dev'+polar+'">'+body+'</div>'+tv);
  };

  /**
   * 迷你折线（趋势）。检验单 marks-and-anatomy：线 2px、端点 >=8px 且带 2px 底色描边、
   * 面积 10% 水洗、网格 1px 实线。**只标端点**，不给每个点标数字。
   */
  Y.spark = function(o){
    o = o||{};
    var vals = (o.values||[]).map(Y.num);
    if (vals.length < 2) return Y.emptyState(o.title, "至少要两个点才画得出趋势");
    var W=560,H=46,P=3;
    var max=Math.max.apply(null,vals), min=Math.min.apply(null,vals);
    var span=(max-min)||1;
    var x=function(i){ return P + i*(W-2*P)/(vals.length-1); };
    var y=function(v){ return H-P - (v-min)/span*(H-2*P); };
    var d=vals.map(function(v,i){ return (i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1); }).join(" ");
    var area=d+" L"+x(vals.length-1).toFixed(1)+" "+(H-P)+" L"+x(0).toFixed(1)+" "+(H-P)+" Z";
    var last=vals[vals.length-1];
    var svg='<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="'+Y.esc(o.title||"趋势")+'">'+
      '<path class="ar" d="'+area+'"/><path class="ln" d="'+d+'"/>'+
      '<circle class="end" cx="'+x(vals.length-1).toFixed(1)+'" cy="'+y(last).toFixed(1)+'" r="4"/></svg>';
    var ends = '<div class="row between"><span class="muted">'+Y.esc((o.labels||[])[0]||"")+'</span>'+
      '<span class="small">'+Y.esc((o.labels||[])[o.labels.length-1]||"")+'：<b>'+Y.esc(o.endText!=null?o.endText:Y.fmt(last,1))+'</b></span></div>';
    var tv = Y.tableView([o.labelHead||"时间",{t:o.valueHead||"数值",n:1}],
      vals.map(function(v,i){ return [(o.labels||[])[i]||("#"+(i+1)), Y.fmt(v,1)]; }));
    return Y.viz(o.title, o.sub, svg+ends+tv);
  };

  /** 热力格（连续量级：单 hue，2px 底色缝分隔）。检验单：Compare magnitude on a grid ⇒ heatmap。 */
  Y.heat = function(o){
    o=o||{};
    var rows=o.rows||[], cols=o.cols||[], cells=o.cells||[];
    if(!rows.length||!cols.length) return Y.emptyState(o.title,"没有数据");
    var flat=[]; cells.forEach(function(r){ (r||[]).forEach(function(v){ flat.push(Y.num(v)); }); });
    // 🔴 09-08 看图改：原来 min 强行 concat([0])，数据在 73~97 的窄带里时
    //    五档色阶全被挤到高端 ⇒ 42 个格子看着一个色，热力格白画。
    //    热力格是**颜色编码**不是长度编码，不需要零基线；范围写在图例上（见下）。
    var max=Math.max.apply(null,flat), min=Math.min.apply(null,flat);
    if (!isFinite(max)) { max=1; min=0; }
    var step=function(v){ var t=(Y.num(v)-min)/((max-min)||1); return "s"+Math.max(1,Math.min(5,Math.ceil(t*5)||1)); };
    var head='<div class="heat" style="grid-template-columns:132px repeat('+cols.length+',minmax(0,1fr))">'+
      '<span></span>'+cols.map(function(c){ return '<span class="hl">'+Y.esc(c)+'</span>'; }).join("");
    var body=rows.map(function(rname,ri){
      return '<span class="bl small">'+Y.esc(rname)+'</span>'+
        cols.map(function(_,ci){
          var v=(cells[ri]||[])[ci];
          return '<span class="c '+step(v)+'"><span class="tip">'+Y.esc(rname+" · "+cols[ci]+"："+Y.fmt(v,1))+'</span></span>';
        }).join("");
    }).join("");
    var tv=Y.tableView([o.labelHead||"项目"].concat(cols.map(function(c){ return {t:c,n:1}; })),
      rows.map(function(rname,ri){ return [rname].concat(cols.map(function(_,ci){ return Y.fmt((cells[ri]||[])[ci],1); })); }));
    var lo=Y.fmt(min,1), hi=Y.fmt(max,1);
    var legend='<div class="scale"><span>'+Y.esc((o.unit?lo+o.unit:lo))+'</span>'+
      '<i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i>'+
      '<span>'+Y.esc((o.unit?hi+o.unit:hi))+'</span></div>';
    return Y.viz(o.title,o.sub,legend+head+body+'</div>'+tv);
  };

  /** 比率对限值。检验单：A single ratio against a limit ⇒ meter（轨道用同 ramp 更浅一档，不是灰）。 */
  Y.meter = function(v,max,tone){
    var p=Math.max(0,Math.min(100, Y.num(v)/(Y.num(max)||1)*100));
    return '<div class="meter"><i'+(tone?' class="'+tone+'"':'')+' style="width:'+p+'%"></i></div>';
  };

  /** 图表外框：标题 + **一句结论** + 图。结论不是可选装饰——一图一结论。 */
  Y.viz = function(title,sub,inner){
    return '<div class="viz">'+
      (title?'<p class="vt">'+Y.esc(title)+'</p>':'')+
      (sub?'<p class="vs">'+Y.esc(sub)+'</p>':'')+inner+'</div>';
  };
  Y.legend = function(items){
    return '<ul class="lg">'+(items||[]).map(function(it){
      return '<li><i class="'+(it.cls||"on")+'"></i>'+Y.esc(it.t)+'</li>';
    }).join("")+'</ul>';
  };
  Y.emptyState = function(title,msg,icon){
    return '<div class="state"><div class="ic">'+(icon||"—")+'</div><h3>'+Y.esc(title||"暂无数据")+'</h3>'+
      '<p>'+Y.esc(msg||"")+'</p></div>';
  };
  Y.errorState = function(msg){
    return '<div class="state err"><div class="ic">!</div><h3>这块没加载出来</h3><p>'+Y.esc(msg||"")+'</p></div>';
  };
  Y.skeleton = function(n){
    var one='<div class="sk"><div class="ln" style="width:38%"></div><div class="ln" style="width:72%"></div></div>';
    return '<div class="skel">'+new Array(n||3).fill(one).join("")+'</div>';
  };

  // ── 模块组件（对应 componentCss 里收敛出来的那批）─────────────
  Y.person = function(o){
    o=o||{};
    var ini = o.initial || String(o.name||"?").slice(0,2);
    return '<div class="person"><div class="av">'+Y.esc(ini)+'</div><div class="pi">'+
      '<div class="pn">'+Y.esc(o.name)+'</div>'+
      (o.role?'<div class="pr">'+Y.esc(o.role)+'</div>':'')+'</div></div>';
  };
  Y.kanban = function(lanes,cols){
    var n = cols || Math.min(5, Math.max(3, (lanes||[]).length));
    return '<div class="kanban k'+n+'">'+(lanes||[]).map(function(l){
      return '<div class="lane"><h3>'+Y.esc(l.title)+'<span class="cnt">'+((l.cards||[]).length)+'</span></h3>'+
        ((l.cards||[]).length ? (l.cards||[]).map(function(c){
          return '<div class="tk">'+
            (c.id?'<div class="tkid">'+Y.esc(c.id)+'</div>':'')+
            '<div class="tkt">'+Y.esc(c.title)+'</div>'+
            (c.meta?'<div class="tkm">'+Y.esc(c.meta)+'</div>':'')+
            (c.badges?'<div class="tka">'+c.badges.map(function(b){ return Y.badge(b.t,b.tone); }).join("")+'</div>':'')+
            (c.actions?'<div class="tka">'+c.actions.map(function(a){
              var at=""; var dd=a.attrs||{};
              for (var k in dd) if (Object.prototype.hasOwnProperty.call(dd,k)) at+=' '+k+'="'+Y.esc(dd[k])+'"';
              return '<button class="btn btn-sm '+(a.tone||"btn-o")+'"'+at+(a.disabled?' disabled':'')+'>'+Y.esc(a.label)+'</button>';
            }).join("")+'</div>':'')+
            (c.tip?'<span class="tip">'+Y.esc(c.tip)+'</span>':'')+
          '</div>';
        }).join("") : '<div class="empty">这条泳道是空的</div>')+
      '</div>';
    }).join("")+'</div>';
  };
  Y.qa = function(items){
    return (items||[]).map(function(it){
      return '<div class="qa"><div class="q">'+Y.esc(it.q)+'</div><div class="a">'+Y.esc(it.a)+'</div></div>';
    }).join("");
  };
  Y.steps = function(items){
    return '<ol class="steps">'+(items||[]).map(function(it){
      return '<li><b>'+Y.esc(it.t)+'</b><p>'+Y.esc(it.p)+'</p></li>';
    }).join("")+'</ol>';
  };
  Y.cmp = function(o){
    o=o||{};
    var rows=(o.rows||[]).map(function(r){
      return '<div class="cr"><span>'+Y.esc(r.k)+'</span><b'+(r.tone?' class="'+r.tone+'"':'')+'>'+Y.esc(r.v)+'</b></div>';
    }).join("");
    return '<div class="card cmp"><div class="ch"><div><b>'+Y.esc(o.title)+'</b>'+
      (o.sub?'<span class="cs">'+Y.esc(o.sub)+'</span>':'')+'</div>'+
      (o.badge?Y.badge(o.badge.t,o.badge.tone):'')+'</div>'+rows+
      (o.inner||'')+
      (o.note?'<p class="cn">'+Y.esc(o.note)+'</p>':'')+'</div>';
  };
  Y.grid = function(items,cols){
    return '<div class="grid g'+(cols||2)+'">'+(items||[]).join("")+'</div>';
  };
  /** 垂直堆叠。模块不许内联 margin（lint 会报），间距归 componentCss 的 .vstack 管 */
  Y.stack = function(items,density){
    return '<div class="vstack'+(density?' '+density:'')+'">'+(items||[]).join("")+'</div>';
  };
  Y.wrap = function(inner){ return '<div class="wrap">'+inner+'</div>'; };

  window.Y = Y;
})();
</script>
  <script>
/* 淡紫色主题（人事 Agent）——覆盖平台 --y-* 设计变量，见 hr-theme.mjs */
